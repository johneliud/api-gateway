spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-register
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/register
                - Method=POST

            - id: identity-login
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth/login
                - Method=POST
              filters:
                - name: RateLimitGatewayFilter
