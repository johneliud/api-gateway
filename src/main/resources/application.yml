server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    import: optional:classpath:application-secrets.properties
  cloud:
    gateway:
      # Default filters applied to all routes
      default-filters:
        - RemoveRequestHeader=X-User-Id
        - RemoveRequestHeader=X-User-Role

      routes:
        - id: identity-register
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/register
            - Method=POST

        - id: identity-login
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/login
            - Method=POST
          filters:
            - name: RateLimitGatewayFilter

        - id: identity-refresh
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/refresh
            - Method=POST

        - id: identity-logout
          uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/auth/logout
            - Method=POST

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.github.johneliud.api_gateway: INFO
    org.springframework.cloud.gateway: INFO
