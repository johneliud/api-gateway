server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    import:
      - optional:classpath:application-secrets.properties
      - optional:file:./config/application-identity-service.yml
      - optional:file:/app/config/application.yml
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - RemoveRequestHeader=X-User-Id
            - RemoveRequestHeader=X-User-Roles

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration: ${JWT_EXPIRATION:86400000}

rate:
  limit:
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
      refill:
        tokens: ${RATE_LIMIT_LOGIN_REFILL_TOKENS:5}
        minutes: ${RATE_LIMIT_LOGIN_REFILL_MINUTES:15}

identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8081}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    io.github.johneliud.api_gateway: INFO
    org.springframework.cloud.gateway: INFO
