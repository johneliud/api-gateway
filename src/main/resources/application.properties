spring.application.name=api-gateway

# JWT Configuration
jwt.secret=${JWT_SECRET:change-me-in-production}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Rate limiting configuration
rate.limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
rate.limit.login.refill.tokens=${RATE_LIMIT_LOGIN_REFILL_TOKENS:5}
rate.limit.login.refill.minutes=${RATE_LIMIT_LOGIN_REFILL_MINUTES:15}

# Service URLs
identity.service.url=${IDENTITY_SERVICE_URL:http://localhost:8081}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Import secrets (optional, for local development)
spring.config.import=optional:classpath:application-secrets.properties
